[package]
name = "orcher-core-native"
version = "0.1.0"
edition = "2021"
authors = ["Orcher Contributors"]
description = "Native Node.js bindings for the Orcher SDK core, via Neon"
license = "Apache-2.0"
repository = "https://github.com/orcher-io/sdk-ts"
keywords = ["orcher", "workflow", "neon", "nodejs"]
categories = ["api-bindings", "development-tools"]

[lib]
name = "orcher_core"
crate-type = ["cdylib"]

[dependencies]
# Neon: Node.js N-API bindings for Rust.
neon = { version = "1.0", default-features = false, features = ["napi-6", "futures"] }

# Orcher SDK Core, from crates.io: the kernel, the worker host and the
# clients this crate binds for TypeScript, speaking encoded kernel and host
# messages. To build against a local checkout instead, see
# .cargo/config.example.toml.
orcher-sdk-core = "0.21"

# Async runtime
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "macros", "sync"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression, used by the codec bindings
flate2 = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Utilities
once_cell = "1.19"

[build-dependencies]
neon-build = "0.1"

[profile.release]
# Fully optimized, with LTO and stripped symbols
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Unoptimized with debug info, for faster builds
opt-level = 0
debug = true

# Platform-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(target_os = "windows")'.dependencies]

